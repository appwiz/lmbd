[package]
name = "lmbd"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aws-sdk-s3 = "1.0"
aws-config = "1.0"
aws-types = "1.0"
notify = "6.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.0"
clap = { version = "4.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.0"
